name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image ref
        id: ref
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}:sha-${GITHUB_SHA::7}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host deploy
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${SSH_PORT}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
          CFG

      - name: Upload compose file
        run: |
          ssh deploy "mkdir -p '${DEPLOY_PATH}'"
          scp docker-compose.yml "deploy:${DEPLOY_PATH}/docker-compose.yml"

      - name: Roll out
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # Токен уходит через stdin, а не аргументом — иначе он виден в ps на сервере
          {
            printf 'GHCR_TOKEN=%q' "$GHCR_TOKEN"; echo
            cat <<'REMOTE'
          set -euo pipefail
          cd "$1"
          export API_IMAGE="$2"

          test -f .env || { echo "::error::${PWD}/.env not found on server"; exit 1; }

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$3" --password-stdin
          unset GHCR_TOKEN
          trap 'docker logout ghcr.io >/dev/null' EXIT

          docker compose pull api
          # --wait падает, если контейнер не стал healthy
          docker compose up -d --no-build --remove-orphans --wait --wait-timeout 120
          docker image prune -f
          REMOTE
          } | ssh deploy bash -s -- "${DEPLOY_PATH}" "${IMAGE}" "${GHCR_USER}"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
