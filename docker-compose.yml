# Фиксированное имя проекта: сеть всегда называется startup_back_default,
# в какой бы папке ни лежал файл (к ней подключается фронтенд).
name: startup_back

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    # На сервере API_IMAGE указывает на образ из GHCR (его подставляет CI),
    # локально образ собирается из исходников.
    image: ${API_IMAGE:-startup-back:local}
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  pgdata:
